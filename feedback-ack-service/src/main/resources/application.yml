server:
  port: 8083
security:
  gateway-secret: ${GATEWAY_SHARED_SECRET:}
spring:
  application:
    name: feedback-ack-service
  datasource:
    url: jdbc:h2:mem:feedbackackservice;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    instance-id: ${spring.application.name}:${server.port}
